name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Core tests
        run: swift test
      - name: Universal release application
        run: scripts/build-app.sh
      - name: Validate fictional example
        run: dist/Producktive.app/Contents/Resources/bin/producktive-cli validate --file "$PWD/examples/deadlines.md"
      - uses: actions/upload-artifact@v4
        with:
          name: Producktive-unsigned
          path: dist/Producktive.app
